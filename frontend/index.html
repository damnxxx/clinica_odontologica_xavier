<body><main><h1>Clínica Odontológica Xavier</h1><p>A interface integrada agora é servida pela própria aplicação Spring Boot.</p>
<p>Inicie o PostgreSQL e execute <code>mvn spring-boot:run</code>; depois acesse <a href="http://localhost:8080/">http://localhost:8080/</a>.</p>
<p>Configure <code>ADMIN_EMAIL</code>, <code>ADMIN_PASSWORD</code> e <code>JWT_SECRET</code> no arquivo <code>.env</code> local antes do primeiro acesso.</p></main></body></html>
