spring.config.import=optional:file:.env[.properties]
spring.application.name=clinica-odontologica
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_xavier}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:clinica_app}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
