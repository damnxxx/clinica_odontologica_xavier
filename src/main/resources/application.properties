spring.config.import=optional:file:.env[.properties]
spring.application.name=clinica-odontologica
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_xavier}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:clinica_app}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-ttl-seconds=1800
app.security.jwt-issuer=${JWT_ISSUER:clinica-odontologica}
app.security.jwt-audience=${JWT_AUDIENCE:clinica-odontologica-web}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.name=${ADMIN_NAME:Administrador}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
server.error.include-message=never
